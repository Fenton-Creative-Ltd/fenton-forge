<style>
.venice-background {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
}
.venice-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0.6;
}
</style>
<div class="venice-background">
  <canvas class="venice-canvas" id="liquidCanvas"></canvas>
</div>
<script>
const canvas = document.getElementById('liquidCanvas');
const ctx = canvas.getContext('2d');
let width, height, blobs = [], mouse = { x: 0, y: 0 };
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();
class Blob {
  constructor() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.radius = Math.random() * 200 + 100;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5;
    this.color = ['rgba(102, 126, 234, 0.4)', 'rgba(118, 75, 162, 0.35)', 'rgba(240, 147, 251, 0.3)', 'rgba(79, 172, 254, 0.35)', 'rgba(67, 233, 123, 0.25)', 'rgba(250, 112, 154, 0.3)'][Math.floor(Math.random() * 6)];
    this.pulse = Math.random() * Math.PI * 2;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.pulse += 0.02;
    this.currentRadius = this.radius + Math.sin(this.pulse) * 30;
    const dx = mouse.x - this.x, dy = mouse.y - this.y;
    if (Math.sqrt(dx * dx + dy * dy) < 300) {
      this.x -= dx * 0.01;
      this.y -= dy * 0.01;
    }
    if (this.x < -this.radius) this.x = width + this.radius;
    if (this.x > width + this.radius) this.x = -this.radius;
    if (this.y < -this.radius) this.y = height + this.radius;
    if (this.y > height + this.radius) this.y = -this.radius;
  }
  draw() {
    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.currentRadius);
    gradient.addColorStop(0, this.color);
    gradient.addColorStop(0.5, this.color.replace(/[\d.]+\)$/, '0.2)'));
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI * 2);
    ctx.fill();
  }
}
for (let i = 0; i < 8; i++) blobs.push(new Blob());
window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
function animate() {
  ctx.clearRect(0, 0, width, height);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
  ctx.lineWidth = 1;
  for (let i = 0; i < blobs.length; i++) {
    for (let j = i + 1; j < blobs.length; j++) {
      const dx = blobs[i].x - blobs[j].x, dy = blobs[i].y - blobs[j].y;
      if (Math.sqrt(dx * dx + dy * dy) < 400) {
        ctx.beginPath();
        ctx.moveTo(blobs[i].x, blobs[i].y);
        ctx.lineTo(blobs[j].x, blobs[j].y);
        ctx.stroke();
      }
    }
  }
  blobs.forEach(blob => { blob.update(); blob.draw(); });
  requestAnimationFrame(animate);
}
animate();
</script>
