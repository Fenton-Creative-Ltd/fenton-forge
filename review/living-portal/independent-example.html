  drawConstellations(ctx,c,w,h,t){
    const p=[[.13,.14],[.19,.19],[.26,.15],[.31,.23],[.61,.13],[.68,.18],[.75,.15],[.81,.23],[.44,.29],[.51,.22],[.58,.29]];
    const s=[[0,1],[1,2],[2,3],[4,5],[5,6],[6,7],[8,9],[9,10]];
    ctx.save();ctx.globalCompositeOperation='screen';ctx.lineWidth=.8;
    for(const [a,b] of s){
      ctx.strokeStyle=`rgba(255,255,255,${.07+(Math.sin(t*2+a)+1)*.025})`;ctx.beginPath();ctx.moveTo(p[a][0]*w,p[a][1]*h);ctx.lineTo(p[b][0]*w,p[b][1]*h);ctx.stroke();
    }ctx.restore();
  }
  drawAurora(ctx,c,w,h,t,px,py,audio){
    ctx.save();ctx.globalCompositeOperation='screen';ctx.filter=`blur(${Math.max(12,c.blur)}px)`;
    const p=c.motionPresence;
    for(let band=0;band<Math.max(3,Math.floor(c.density*.65));band++){
      const horizontal=Math.sin(t*.38+band)*w*.045*p;
      const base=h*(.24+band*.09)+Math.cos(t*.55+band*.8)*h*.024*p;
      const amp=h*(.065+band*.014)*c.intensity*(1+audio*.25)*(.85+.15*p);
      ctx.beginPath();
      for(let st=0;st<=72;st++){
        const u=st/72,x=u*w+horizontal*Math.sin(u*Math.PI);
        const y=base+Math.sin(u*5+t*(1.6+.12*p)+band)*amp+Math.sin(u*11-t*(.82+.08*p))*amp*.26+py*h*.026;
        st?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.lineTo(w,h*.76);ctx.lineTo(0,h*.76);ctx.closePath();
      const gr=ctx.createLinearGradient(0,base,w,base);
      gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.28,rgba(c.colors[2+band%3]||c.colors[2],.13*c.opacity));gr.addColorStop(.62,rgba(c.colors[4]||c.colors[3],.20*c.opacity));gr.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gr;ctx.fill();
    }ctx.restore();
  }
  drawParticles(ctx,c,w,h,t,px,py,audio){
    ctx.save();ctx.globalCompositeOperation='screen';
    const count=55+c.density*8;
    for(let i=0;i<count;i++){
      const baseX=hash01(i*2.3+c.seed),baseY=hash01(i*5.7+c.seed);
      const x=(baseX*w+Math.sin(t*(.8+hash01(i))+i)*22*c.intensity+px*18*(i%3)+w)%w;
      const y=(baseY*h+Math.cos(t*(.6+hash01(i+4))+i)*16*c.intensity+py*14*(i%2)+h)%h;
      const r=.5+hash01(i*9.1)*2.3*(1+audio*.55);
      ctx.beginPath();ctx.fillStyle=rgba(c.colors[2+i%Math.max(1,c.colors.length-2)]||c.colors[3],(.25+hash01(i)*.45)*c.opacity);ctx.arc(x,y,r,0,TAU);ctx.fill();
    }ctx.restore();
  }
  drawNeural(ctx,c,w,h,t,px,py,audio){
    const nodes=[],cols=Math.max(5,Math.round(c.density)),rows=Math.max(4,Math.round(c.density*.7)),p=c.motionPresence;
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
      const i=y*cols+x,jx=(hash01(i+c.seed)-.5)*w/cols*.55,jy=(hash01(i*3+c.seed)-.5)*h/rows*.5;
      nodes.push({x:(x+.5)*w/cols+jx+Math.sin(t*(.85+.02*i)+i)*7*p+px*12,y:(y+.5)*h/rows+jy+Math.cos(t*(.72+.018*i)+i)*6*p+py*9});
    }
    ctx.save();ctx.globalCompositeOperation='screen';
    for(let i=0;i<nodes.length;i++){
      let nearest=-1,nearestD=Infinity;
      for(let j=i+1;j<nodes.length;j++){
        const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d=Math.hypot(dx,dy),max=Math.max(w/cols,h/rows)*1.65;
        if(d<max){
          const alpha=(.09*(1-d/max)+audio*.035)*c.opacity;
          ctx.strokeStyle=rgba(c.colors[2+(i+j)%3]||c.colors[3],alpha);ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke();
          if(d<nearestD){nearestD=d;nearest=j;}
        }
      }
      if(nearest>=0){const q=(t*.52*p+i*.113)%1,sx=nodes[i].x+(nodes[nearest].x-nodes[i].x)*q,sy=nodes[i].y+(nodes[nearest].y-nodes[i].y)*q;ctx.beginPath();ctx.fillStyle=rgba(c.colors[4]||'#9eeaff',.75);ctx.arc(sx,sy,1.6+audio*1.1,0,TAU);ctx.fill();}
      const pulse=.8+.2*Math.sin(t*3+i*.7);ctx.beginPath();ctx.fillStyle=rgba(c.colors[3+i%2]||c.colors[3],(.36+audio*.2)*c.opacity);ctx.arc(nodes[i].x,nodes[i].y,(1.3+(i%7===0?1:0))*pulse,0,TAU);ctx.fill();
    }ctx.restore();
  }
  drawLiquidGlass(ctx,c,w,h,t,px,py,audio){
    ctx.save();ctx.globalCompositeOperation='screen';ctx.filter=`blur(${Math.max(10,c.blur*.72)}px)`;
    const p=c.motionPresence;
    for(let i=0;i<Math.max(4,c.density);i++){
      const x=w*(.1+hash01(i+c.seed)*.8)+Math.sin(t*(.72+.04*i)+i)*w*.052*p+px*w*.035;
      const y=h*(.14+hash01(i*3+c.seed)*.72)+Math.cos(t*(.57+.03*i)+i)*h*.044*p+py*h*.025;
      const breath=1+.11*Math.sin(t*(1.15+.05*i)+i),rx=w*(.10+hash01(i*8+c.seed)*.12)*(1+audio*.08)*breath,ry=h*(.08+hash01(i*5+c.seed)*.10)*(2-breath);
      const g=ctx.createRadialGradient(x,y,0,x,y,Math.max(rx,ry));g.addColorStop(0,rgba(c.colors[2+i%Math.max(1,c.colors.length-2)]||c.colors[3],.20*c.opacity));g.addColorStop(.55,rgba(c.colors[4]||c.colors[3],.08*c.opacity));g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,rx,ry,Math.sin(t*.36+i)*.42,0,TAU);ctx.fill();
    }ctx.restore();
  }
  drawConstellationMap(ctx,c,w,h,t){
    const n=Math.max(18,c.density*6),pts=[],p=c.motionPresence;
    for(let i=0;i<n;i++){
      const bx=hash01(i*11.7+c.seed)*w;
      const by=hash01(i*4.9+c.seed)*h*.68;
      const driftX=Math.sin(t*(.52+hash01(i)*.28)+i*.7)*w*.010*p;
      const driftY=Math.cos(t*(.44+hash01(i+4)*.25)+i*.9)*h*.012*p;
      pts.push({x:bx+driftX,y:by+driftY});
    }
    ctx.save();ctx.globalCompositeOperation='screen';
    for(let i=0;i<n;i++){
      let nearest=-1,dist=Infinity;
      for(let j=0;j<n;j++){
        if(i===j)continue;
        const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
        if(d<dist){dist=d;nearest=j;}
      }
      if(nearest>=0&&dist<Math.max(w,h)*.19){
        const a=.07+.035*(Math.sin(t*1.8+i*.45)+1);
        ctx.strokeStyle=`rgba(190,235,255,${a})`;
        ctx.lineWidth=.75;
        ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[nearest].x,pts[nearest].y);ctx.stroke();

        // travelling light pulse makes motion perceptible at a glance
        const q=(t*.42*p+i*.137)%1;
        const px=pts[i].x+(pts[nearest].x-pts[i].x)*q;
        const py=pts[i].y+(pts[nearest].y-pts[i].y)*q;
        const pulseR=1.4+1.2*(.5+.5*Math.sin(t*4+i));
        ctx.beginPath();
        ctx.fillStyle=rgba(c.colors[4]||'#9eeaff',.72);
        ctx.arc(px,py,pulseR,0,TAU);
        ctx.fill();
      }
      const pulse=.75+.25*Math.sin(t*2.8+i*.6);
      ctx.fillStyle=i%8===0?rgba(c.colors[4]||'#fff',.92):`rgba(255,255,255,${.40+.22*pulse})`;
      ctx.beginPath();ctx.arc(pts[i].x,pts[i].y,(i%8===0?1.8:.8)*pulse,0,TAU);ctx.fill();
    }
    ctx.restore();
  }
  drawThinking(ctx,c,w,h,t,px,py,audio){
    const cx=w*(.5+px*.03),cy=h*(.5+py*.03),p=c.motionPresence;
    ctx.save();ctx.globalCompositeOperation='screen';
    const rings=Math.max(4,Math.round(c.density*.8));
    for(let i=0;i<rings;i++){
      const travelling=((t*.23*p+i/rings)%1),rad=Math.min(w,h)*(.07+i*.05+travelling*.035)*(1+.04*Math.sin(t*2+i));
      ctx.strokeStyle=rgba(c.colors[2+i%3]||c.colors[3],(.075+i*.012+audio*.04)*c.opacity);ctx.lineWidth=1+.35*Math.sin(t*2.4+i);ctx.beginPath();
      for(let st=0;st<=120;st++){const a=TAU*st/120+t*.08*(i%2?1:-1),noise=Math.sin(a*(3+i)+t*(1.35+i*.08))*rad*.09*c.intensity,x=cx+Math.cos(a)*(rad+noise),y=cy+Math.sin(a)*(rad*.58+noise*.42);st?ctx.lineTo(x,y):ctx.moveTo(x,y)}
      ctx.closePath();ctx.stroke();
    }
    const phase=(t*.30*p)%1,pulseR=Math.min(w,h)*(.05+phase*.28);ctx.beginPath();ctx.strokeStyle=rgba(c.colors[4]||'#9eeaff',.16*(1-phase));ctx.lineWidth=2;ctx.arc(cx,cy,pulseR,0,TAU);ctx.stroke();
    ctx.filter=`blur(${Math.max(8,c.blur*.45)}px)`;const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(w,h)*.28);g.addColorStop(0,rgba(c.colors[3]||c.colors[2],(.18+audio*.12)*c.opacity));g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.restore();
  }
  drawOrbits(ctx,c,w,h,t){
    ctx.save();ctx.globalCompositeOperation='screen';ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
    const cx=w*.52,cy=h*.48;
    [.18,.29,.40].forEach((r,i)=>{ctx.beginPath();ctx.ellipse(cx,cy,w*r,h*(r*.42),Math.sin(t*.25+i)*.06,0,TAU);ctx.stroke();});
    ctx.restore();
  }
  drawGrain(ctx,c,w,h,t){
    if(c.grain<=0)return;
    ctx.save();ctx.globalCompositeOperation='screen';
    const count=Math.floor(Math.min(240,w*h/8000)*c.grain*4);
    for(let i=0;i<count;i++){
      const x=hash01(i*91+c.seed+Math.floor(t*2))*w,y=hash01(i*47+c.seed+Math.floor(t*2))*h;
      ctx.fillStyle=`rgba(255,255,255,${.015*c.grain})`;ctx.fillRect(x,y,1,1);
    }ctx.restore();
  }
  drawVignette(ctx,w,h){
    const v=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.14,w/2,h/2,Math.max(w,h)*.82);
    v.addColorStop(.28,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.52)');ctx.fillStyle=v;ctx.fillRect(0,0,w,h);
  }
}

if(!customElements.get('fc-visual-engine'))customElements.define('fc-visual-engine',FCVisualEngine);

};
